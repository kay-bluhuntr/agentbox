# Local development stack: Postgres + the API in "local" executor mode.
# For the real Kubernetes path, use `make kind-up` instead.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentbox
      POSTGRES_PASSWORD: agentbox
      POSTGRES_DB: agentbox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbox"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    environment:
      AGENTBOX_DATABASE_URL: postgresql+psycopg://agentbox:agentbox@postgres:5432/agentbox
      AGENTBOX_EXECUTOR: local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
