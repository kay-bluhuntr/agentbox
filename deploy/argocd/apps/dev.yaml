# Dev environment. Multi-source Application (ArgoCD 2.6+): the Helm *chart* comes
# from this app repo, while the environment *values* come from the separate
# agentbox-gitops repo (the `$values` ref). CI writes the image tag into that
# repo, so this app repo never receives bot commits. Fully automated sync: a tag
# bump in agentbox-gitops lands here within one reconcile interval.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentbox-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: agentbox
  sources:
    - repoURL: https://github.com/kay-bluhuntr/agentbox
      targetRevision: main
      path: deploy/helm/agentbox
      helm:
        releaseName: agentbox
        valueFiles:
          - $values/envs/dev/values.yaml
    - repoURL: https://github.com/kay-bluhuntr/agentbox-gitops
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: agentbox-dev
  syncPolicy:
    automated:
      prune: true     # resources removed from Git are removed from the cluster
      selfHeal: true  # hand-edits to the cluster are reverted: Git is authoritative
    syncOptions:
      - CreateNamespace=true
