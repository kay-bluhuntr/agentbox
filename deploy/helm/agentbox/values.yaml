image:
  repository: ghcr.io/kayode-odewale/agentbox
  tag: "0.1.0"  # overwritten by CI: deploy-dev job pins to github.sha
  pullPolicy: Always

replicaCount: 2  # safe: reconciler leader-elects via Postgres advisory lock

execNamespace: agentbox-exec

database:
  # In production this comes from a Secret (e.g. ExternalSecrets -> AWS Secrets Manager).
  # The chart reads it from an existing secret to keep credentials out of values files.
  existingSecret: agentbox-db  # checkov:skip=CKV_SECRET_6: Secret reference name, not a secret value
  secretKey: database-url  # checkov:skip=CKV_SECRET_6: Secret reference name, not a secret value

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Guardrails applied to the execution namespace
execQuota:
  pods: "50"
  requestsCpu: "10"
  requestsMemory: 20Gi
  limitsCpu: "20"
  limitsMemory: 40Gi

# Observability bootstrap. Off by default: these need the Prometheus Operator
# CRDs in-cluster, which the kind dev cluster doesn't ship. Enabled per-env
# (see deploy/envs/prod/values.yaml) where the operator is present.
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}  # e.g. {release: kube-prometheus-stack} to match the operator's selector

monitoring:
  prometheusRule:
    enabled: false
    labels: {}  # must match the operator's ruleSelector
  slo:
    # Target success ratio for the reconciler control loop; drives burn-rate alerts.
    reconcileSuccessTarget: 0.99

# Progressive delivery. Off by default: ships the control plane as a plain
# Deployment. When enabled, it ships as an Argo Rollouts Rollout with a canary
# strategy instead (requires the Argo Rollouts controller in-cluster).
rollout:
  enabled: false
  canaryWeight: 20     # initial % of traffic to the new version
  pauseDuration: 60s   # soak time at each step
  analysis:
    prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
    maxReconcileErrorRatio: 0.1   # fail the canary above 10% reconcile errors
    maxApiP99Seconds: 1.0         # fail the canary above 1s p99 API latency
