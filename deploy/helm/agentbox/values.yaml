image:
  repository: ghcr.io/kayode-odewale/agentbox
  tag: "0.1.0"  # overwritten by CI: deploy-dev job pins to github.sha
  pullPolicy: Always

replicaCount: 2  # safe: reconciler leader-elects via Postgres advisory lock

execNamespace: agentbox-exec

database:
  # In production this comes from a Secret (e.g. ExternalSecrets -> AWS Secrets Manager).
  # The chart reads it from an existing secret to keep credentials out of values files.
  existingSecret: agentbox-db  # checkov:skip=CKV_SECRET_6: Secret reference name, not a secret value
  secretKey: database-url  # checkov:skip=CKV_SECRET_6: Secret reference name, not a secret value

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Guardrails applied to the execution namespace
execQuota:
  pods: "50"
  requestsCpu: "10"
  requestsMemory: 20Gi
  limitsCpu: "20"
  limitsMemory: 40Gi
