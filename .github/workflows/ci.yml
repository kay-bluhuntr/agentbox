name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Ephemeral throwaway DB: lives only for this job, never network-exposed.
      # Not a real secret — the password is fixed so the test step can connect.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentbox
          POSTGRES_PASSWORD: agentbox
          POSTGRES_DB: agentbox
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agentbox"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (SQLite)
        run: pytest tests/ -v
      - name: Tests (Postgres)
        run: pytest tests/ -v
        env:
          AGENTBOX_TEST_DATABASE_URL: postgresql+psycopg://agentbox:agentbox@localhost:5433/agentbox

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Shift-left: scan IaC for misconfigurations before anything ships
      - name: Scan Terraform & Kubernetes manifests (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: deploy/
          quiet: true
          soft_fail: false

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}   # consumed by deploy-dev
    steps:
      - uses: actions/checkout@v5
      - name: Short commit SHA
        id: vars
        # Tag images with the 10-char short SHA (matches `git rev-parse --short`
        # and the promote/commit conventions) instead of the full 40-char SHA.
        run: echo "short_sha=${GITHUB_SHA::10}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3   # enables emulated cross-arch (arm64) builds
      - uses: docker/setup-buildx-action@v3
      - name: Build image (amd64, loaded for scanning)
        # Single-arch load for Trivy: `load: true` can't load a multi-arch manifest
        # into the daemon. The CVEs live in the shared base layers, so scanning the
        # amd64 variant covers arm64 too.
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: agentbox:${{ steps.vars.outputs.short_sha }}
      # Scan the built image for CVEs before it can be pushed
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agentbox:${{ steps.vars.outputs.short_sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image (multi-arch)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Build for both arches so the image runs on amd64 clusters and on
          # arm64 nodes (e.g. local kind on Apple Silicon).
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.short_sha }}
            ghcr.io/${{ github.repository }}:latest

  # GitOps handoff: deployment happens by committing the new image tag to the
  # dev values file in the *separate* agentbox-gitops repo — never this repo.
  # ArgoCD (deploy/argocd/apps/dev.yaml) reads those values and converges the
  # cluster; CI never touches the cluster and holds no kubeconfig. Because the
  # bump lands in another repo, this repo's main only ever changes by human PR
  # (no more bot commits, no [skip ci] dance). Promotion to prod is a PR against
  # agentbox-gitops (scripts/promote.sh).
  #
  # Requires a repo secret GITOPS_TOKEN: a token with write access to
  # kay-bluhuntr/agentbox-gitops (fine-grained PAT or a deploy key).
  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the GitOps repo
        uses: actions/checkout@v5
        with:
          repository: kay-bluhuntr/agentbox-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Pin new image tag in dev values
        env:
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}   # same tag the image was pushed with
        run: |
          sed -i -E "s|^([[:space:]]+tag:).*# managed by CI.*|\1 \"${SHORT_SHA}\"  # managed by CI — do not edit by hand|" \
            envs/dev/values.yaml
          git diff --quiet && { echo "tag unchanged, nothing to do"; exit 0; }
          git config user.name "agentbox-ci"
          git config user.email "agentbox-ci@users.noreply.github.com"
          git add envs/dev/values.yaml
          git commit -m "deploy: ${SHORT_SHA} to dev"
          git push
